name: Refresh Windows 7 profile
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [chatgpt/windows7-profile]
    paths:
      - 'profile/desktop.html'
      - 'profile/render.py'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: windows7-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          python3 -m venv "$RUNNER_TEMP/profile-venv"
          "$RUNNER_TEMP/profile-venv/bin/python" -m pip install 'Pillow==12.1.1' 'playwright==1.58.0' 'imageio-ffmpeg==0.6.0' --quiet
          "$RUNNER_TEMP/profile-venv/bin/python" -c "import PIL, playwright, imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Refresh desktop and public statistics
        run: |
          "$RUNNER_TEMP/profile-venv/bin/python" profile/render.py
      - name: Verify README links
        run: |
          gh api markdown -f text="$(cat README.md)" -f mode=gfm -f context=marxusss/marxusss > "$RUNNER_TEMP/profile-markdown.html"
          test "$(grep -o '<img ' "$RUNNER_TEMP/profile-markdown.html" | wc -l)" -eq 1
          grep -F 'mailto:max@vorwaller.net' "$RUNNER_TEMP/profile-markdown.html"
          grep -F 'https://www.linkedin.com/in/max-vorwaller-724418259/' "$RUNNER_TEMP/profile-markdown.html"
          if grep -q '"name": "reality-restyler"' profile/stats.json; then
            grep -F 'https://github.com/marxusss/reality-restyler' "$RUNNER_TEMP/profile-markdown.html"
          fi
      - name: Commit only changed profile assets
        run: |
          git config user.name "Max Vorwaller"
          git config user.email "59471151+marxusss@users.noreply.github.com"
          git add README.md profile/stats.json assets/windows7
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Windows 7 profile"
          git push
